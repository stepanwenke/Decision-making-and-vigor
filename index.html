    <script>
        // Get the current URL
        const urlParams = new URLSearchParams(window.location.search);

        // Get the value of the 'day' parameter
        const day = urlParams.get('day');
        const task = urlParams.get('task');

        //initialize jsPsych
        let jsPsych = initJsPsych({
            on_finish: function () {
                //window.location = experimentsOrder[taskNumber] + tokenurl;
            }
        });

        // Initialize general timeline
        var general_timeline = [];

        //initialize Pavlovia plugin
        let pavlovia_init = {
            type: jsPsychPavlovia,
            command: "init",
            setPavloviaInfo: function (info) {
                //console.log('initializing pavlovia: ', info);
                pavloviaInfo = info;
                //alert('Pavlovia is initialized');
            }
        };
        //general_timeline.push(pavlovia_init);
        if (task === "effort") {
            console.log("running effort task");
            let timeline_effort = effortTask(1); // Effort task
            jsPsych.run(timeline_effort);
        } else if (task === "rlwm") {
            console.log("running rlwm task");
            let timeline_rlwm = rlwmTask(1); // RLWM task
            jsPsych.run(timeline_rlwm);
        } else if (task === "foraging") {
            console.log("running foraging task");
            let timeline_foraging = foragingTask(1); // Foraging task
            jsPsych.run(timeline_foraging);
        } else if (task === "gonogo") {
            console.log("running gonogo task");
            let timeline_gonogo = gonogoTaskPositive(1); // Go-NoGo Robot Task
            jsPsych.run(timeline_gonogo);
        } else if (day == 0) {
            console.log("running day0");
            day0();
        } else if (day == 1) {
            console.log("running day1");
            day1();
        } else if (day == 2) {
            console.log("running day2");
            day2(); 
        } else {
            console.log("day not found");
        }

    </script>
